<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bethlehem Gebremichael">
    <meta name="description" content="">
    <link rel="stylesheet" href="style.css">
    <title>Semicolon Diaries</title>
</head>
<body>
    <div class="container">
        <div class="photo-container">
            <img src="images/backgroundPicture.jpg" alt="An image of a pc where a lot of code is shown">
            <span>Photo by Daniil Komov on Pexel </span>

        </div>
        <div class="form-container">
            <div class="top">
                <div class="intro">From my first console.log to my last semicolon — join me as I document the messy, real process of learning to code.</div>
                <div>Every dev needs a diary</div>

            </div>
            <div class="center"> 
                <div>Let's do this!</div>
                <form action="#" method="post">
                    <div class="right">
                        <div>
                        <label for="fname">First Name *</label>
                        <input type="text" id="fname" placeholder="Beth" name="fname" required>
                        </div>

                        <div>
                        <label for="email">Email *</label>
                        <input type="email" name="email" id="email" required>
                        </div>
                        <div>
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                    
                
                    </div>

                    <div class="left">
                        <div>
                            <label for="lname">Last Name *</label>
                            <input type="text" id="lname" placeholder="GMichael" name="lname" required>
                        </div>

                        <div>
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" >
                        </div>

                        <div>
                            <label for="confirm"> Confirm Password *</label>
                            <input type="password" id="confirm" name="confirm" required>
                        </div>
                    </div>

                    <div class="bottom">
                        <button>Create Account</button>
                        <div>Already have an account? <a href="#">Log in</a></div>
                    </div>
                        
                </form>
                </div>
            </div>
        </div>

        
    </div>
    
</body>
</html>
